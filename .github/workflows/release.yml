name: Build ArdUi NuGet packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'App/**'
      - 'Core/**'
      - 'Frd/**'
      - 'Overlay/**'
      - 'Testing/**'
      - 'TransitClient/**'
      - 'Transport/**'
      - 'ArdUi.cs'
      - 'ArdUi.csproj'
      - 'GlobalUsings.cs'
      - 'app.manifest'
      - 'config.json'
      - 'install.ps1'
      - 'packaging/**'
      - 'release-public.pem'
      - 'THIRD-PARTY-NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and verify component packages
        shell: pwsh
        run: .\packaging\pack-ardui-nuget.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ardui-nuget-packages
          path: dist/nuget/*.nupkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ardui-nuget-packages
          path: dist/nuget
      - name: Exchange GitHub OIDC for a temporary NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: KateY07
      - name: Publish ArdUi components to NuGet
        shell: pwsh
        run: >
          dotnet nuget push "dist/nuget/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
